<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 234" width="240" height="234">
  <title>DaVinci Resolve</title>
  <defs>
    <linearGradient id="dv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2026"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>

    <!-- Top Petal Radial: Bright core at base (32, 28) radiating to rich cyan #0088cc / #009bd8 -->
    <linearGradient id="cyanGrad">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#60d6ff"/>
      <stop offset="65%" stop-color="#00a2e8"/>
      <stop offset="100%" stop-color="#0077be"/>
    </linearGradient>
    <radialGradient id="dv-cyan" cx="32.135" cy="28.274" fx="32.135" fy="28.274" r="7.0"
      gradientUnits="userSpaceOnUse"
      gradientTransform="matrix(1.0585,0.0893,-0.1651,1.9566,2.7884,-28.1238)"
      xlink:href="#cyanGrad"/>

    <!-- Right Petal Radial: Bright core at base (34, 34) radiating to coral red #ff3044 / #e61e32 -->
    <linearGradient id="redGrad">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#ff6b7a"/>
      <stop offset="65%" stop-color="#ff2e44"/>
      <stop offset="100%" stop-color="#cc1226"/>
    </linearGradient>
    <radialGradient id="dv-red" cx="34.078" cy="33.655" fx="34.078" fy="33.655" r="8.0"
      gradientUnits="userSpaceOnUse"
      gradientTransform="matrix(1.9034,0.7604,-0.4063,1.0171,-17.1101,-25.8195)"
      xlink:href="#redGrad"/>

    <!-- Left Petal Radial: Bright core at base (30, 36) radiating to lime yellow #fcff7c / #d4db18 -->
    <linearGradient id="yellowGrad">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffff77"/>
      <stop offset="70%" stop-color="#e2eb12"/>
      <stop offset="100%" stop-color="#b6be00"/>
    </linearGradient>
    <radialGradient id="dv-yellow" cx="29.661" cy="35.661" fx="29.661" fy="35.661" r="8.0"
      gradientUnits="userSpaceOnUse"
      gradientTransform="matrix(-1.7236,1.1486,-0.5221,-0.7835,99.5795,27.5991)"
      xlink:href="#yellowGrad"/>
  </defs>

  <!-- Squircle Base matching 240x234 standard -->
  <rect x="0" y="0" width="240" height="234" rx="42.5" fill="url(#dv-bg)"/>

