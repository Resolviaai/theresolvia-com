<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F86F7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e2638" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="480" y="44" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">OPERATIONAL ARCHITECTURE COMPARISON</text>
  <text x="480" y="68" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Solo Freelancer Vulnerability vs. Resolvia Redundant Agency Pod</text>

  <!-- LEFT PANEL: Freelance Single Point of Failure -->
  <g transform="translate(40, 95)">
    <rect width="415" height="340" rx="12" fill="#131826" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="415" height="46" rx="12" fill="#1e1822" />
    <circle cx="24" cy="23" r="6" fill="#ef4444" />
    <text x="40" y="28" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Solo Freelancer Model</text>
    <rect x="300" y="13" width="95" height="20" rx="10" fill="#38181e" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1" />
    <text x="347" y="27" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">HIGH RISK</text>

    <!-- Node 1: Creator Request -->
    <rect x="24" y="65" width="367" height="42" rx="8" fill="#192033" stroke="#2a344d" stroke-width="1" />
    <text x="40" y="91" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500">1. Raw Footage Uploaded</text>

    <!-- Arrow Down -->
    <path d="M207 107 L207 122" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Node 2: Solo Editor Bottleneck -->
    <rect x="24" y="125" width="367" height="74" rx="8" fill="#24171d" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1.2" />
    <text x="40" y="148" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Solo Editor (Single Point of Failure)</text>
    <text x="40" y="168" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11.5">Handles Rough Cut, Pacing, Sound &amp; Thumbnails alone.</text>
    <text x="40" y="186" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Risk: Illness, burnout, or client overload stops delivery.</text>

    <!-- Arrow Down -->
    <path d="M207 199 L207 215" stroke="#ef4444" stroke-width="1.5" />

    <!-- Node 3: Unpredictable Bottleneck -->
    <rect x="24" y="217" width="367" height="42" rx="8" fill="#1e1822" stroke="#4a2228" stroke-width="1" />
    <text x="40" y="243" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">Turnaround: 5–10 Days (Unpredictable)</text>

    <!-- Node 4: Business Impact -->
    <rect x="24" y="272" width="367" height="46" rx="8" fill="#131826" stroke="#334155" stroke-width="1" />
    <text x="40" y="293" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Algorithm Outcome:</text>
    <text x="40" y="309" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Missed upload window &#8594; Algorithmic impressions drop</text>
  </g>

  <!-- RIGHT PANEL: Resolvia Redundant Pod -->
  <g transform="translate(505, 95)">
    <rect width="415" height="340" rx="12" fill="#131826" stroke="#2F86F7" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="415" height="46" rx="12" fill="#101c33" />
    <circle cx="24" cy="23" r="6" fill="#2F86F7" />
    <text x="40" y="28" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Resolvia Agency Pod System</text>
    <rect x="300" y="13" width="95" height="20" rx="10" fill="#0d2847" stroke="#2F86F7" stroke-opacity="0.6" stroke-width="1" />
    <text x="347" y="27" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">SLA BACKED</text>

    <!-- Node 1: Creator Request -->
    <rect x="24" y="65" width="367" height="42" rx="8" fill="#192033" stroke="#2a344d" stroke-width="1" />
    <text x="40" y="91" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500">1. Instant Intake via Frame.io Workspace</text>

    <!-- Arrow Down -->
    <path d="M207 107 L207 122" stroke="#2F86F7" stroke-width="1.5" />

    <!-- Node 2: Multi-Specialist Pod -->
    <rect x="24" y="125" width="367" height="74" rx="8" fill="#112240" stroke="#2F86F7" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="40" y="146" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Dedicated 4-Role Pod + Active Backup</text>
    <text x="40" y="165" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="11.5">Lead Story Editor + Fairlight Audio Tech + Art Director.</text>
    <text x="40" y="184" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Redundancy: Secondary editor briefed if lead takes leave.</text>

    <!-- Arrow Down -->
    <path d="M207 199 L207 215" stroke="#2F86F7" stroke-width="1.5" />

    <!-- Node 3: Guaranteed SLA -->
    <rect x="24" y="217" width="367" height="42" rx="8" fill="#0c233c" stroke="#1d4ed8" stroke-width="1" />
    <text x="40" y="243" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Guaranteed SLA: 48 – 72 Hours Fast Turnaround</text>

    <!-- Node 4: Business Impact -->
    <rect x="24" y="272" width="367" height="46" rx="8" fill="#131826" stroke="#1e3a5f" stroke-width="1" />
    <text x="40" y="293" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Algorithm Outcome:</text>
    <text x="40" y="309" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Consistent cadence + High AVD &#8594; Compounding reach</text>
  </g>
</svg>
