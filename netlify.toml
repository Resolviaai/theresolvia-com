[build]
  publish = "."

# 301 Permanent Redirect: www.theresolvia.com -> https://theresolvia.com
[[redirects]]
  from = "https://www.theresolvia.com/*"
  to = "https://theresolvia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.theresolvia.com/*"
  to = "https://theresolvia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://theresolvia.com/*"
  to = "https://theresolvia.com/:splat"
  status = 301
  force = true

